        :root {
            --bg-color: #131f24;
            --text-color: #ffffff;

            --duo-blue: #1cb0f6;
            --duo-blue-down: #1899d6;
            --duo-orange: #ff9600;
            --duo-orange-down: #e68500;
            --card-bg: #202f36;
            --border-color: #37464f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Din Round', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 4px #000;
        }

        .subtitle {
            color: #afafaf;
            font-size: 1rem;
        }

        .global-progress-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 60px;
            box-shadow: 0 6px 0 var(--border-color);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .progress-bar-outer {
            width: 100%;
            background-color: #37464f;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background-color: var(--duo-green);
            transition: width 0.3s ease-in-out;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--duo-green);
        }

        /* The Relative Roadmap Canvas container */
        .roadmap-path {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Dynamic SVG Ribbon Background Track */
        .path-svg {
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            z-index: 1;
            pointer-events: none;
        }

        .path-line-bg {
            fill: none;
            stroke: #25353d;
            stroke-width: 16;
            stroke-linecap: round;
        }

        .path-line-active {
            fill: none;
            stroke: var(--duo-green);
            stroke-width: 16;
            stroke-linecap: round;
            stroke-dasharray: 5000;
            stroke-dashoffset: 5000;
            transition: stroke-dashoffset 0.4s ease-out;
        }

        /* Alternating Node Containers */
        .node-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-bottom: 80px;
        }

        /* Alternate alignments mimicking the classic game layout */
        .node-container.pos-left { align-items: flex-start; padding-left: 20px;}
        .node-container.pos-center { align-items: center; }
        .node-container.pos-right { align-items: flex-end; padding-right: 20px;}

        .node-interactive-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 300px;
        }

        .date-badge {
            background-color: var(--duo-orange);
            color: white;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 3px 0 var(--duo-orange-down);
            text-align: center;
            white-space: nowrap;
        }

        .push-button {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: none;
            background-color: var(--duo-blue);
            box-shadow: 0 6px 0 var(--duo-blue-down);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .push-button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 var(--duo-blue-down);
        }

        .push-button.completed {
            background-color: var(--duo-green);
            box-shadow: 0 6px 0 var(--duo-green-down);
        }

        .push-button.completed:active {
            box-shadow: 0 3px 0 var(--duo-green-down);
        }

        .push-button svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        .content-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-top: 15px;
            width: calc(100vw - 40px);
            max-width: 440px;
            box-shadow: 0 5px 0 var(--border-color);
            align-self: center;
        }

        /* Context alignment adjustments for popup cards */
        .pos-left .content-card { transform: translateX(20px); }
        .pos-right .content-card { transform: translateX(-20px); }

        .course-tag {
            font-size: 0.75rem;
            color: var(--duo-blue);
            font-weight: bold;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .content-card h3 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .growth-task-box {
            background-color: #1c282e;
            border-left: 4px solid var(--duo-orange);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            color: #e3e3e3;
        }

        .qa-box {
            background-color: #131f24;
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #afafaf;
        }

        .qa-title {
            color: var(--duo-blue);
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }
    </style>

        const networkingPool = [
            "Send a crisp, personalized cold message to an SRE Team Lead at Goldman Sachs focusing on infrastructural scaling parameters.",
            "Connect with a Senior Infrastructure Automation Engineer at Atlassian. Inquire directly about their hybrid cloud deployment strategy.",
            "Locate a Tech Lead at Netflix managing Chaos Engineering patterns. Share a quick detail concerning high-concurrency configurations.",
            "Identify an Engineering Principal inside a MAANG tier team. Drop an introductory message highlighting automated GitOps promotion flows."
        ];

        const technicalPool = [
            "Publish a practical engineering post on LinkedIn highlighting a failure scenario and solution logic related to today's core architectural topic.",
            "Draft a structured architectural breakdown note comparing production operational limitations of today's framework parameters.",
            "Map out a clean technical diagram outlining optimization strategies for today's system components and share it directly with your community group."
        ];

        const validationPool = [
            "Explain the architectural difference between directory-based vs workspace-based isolation patterns under distributed remote backend constraints.",
            "How does a Free Execution strategy in configuration management tools alter highly concurrent node updates compared to default Linear strategies?",
            "What architectural procedures effectively prevent state file race conditions when configuring parallel decoupled infrastructure components?",
            "Describe the exact routing mechanism an automated deployment engine leverages to analyze custom metrics before triggering dynamic rollback routines.",
            "Detail the kernel-level components responsible for processing isolated cluster network packet switching across highly secure namespace boundaries."
        ];

        let startDate = new Date(2026, 6, 12);
        const roadmapContainer = document.getElementById('roadmapContainer');
        let checkedStates = JSON.parse(localStorage.getItem('eliteQuestProgressV3')) || new Array(curriculum.length).fill(false);

        // Sequence positions array to map the S-curve zig-zag path smoothly
        const patterns = ['pos-center', 'pos-left', 'pos-center', 'pos-right'];

        function generateRoadmap() {
            roadmapContainer.innerHTML = '';

            curriculum.forEach((item, index) => {
                let currentDay = new Date(startDate);
                currentDay.setDate(startDate.getDate() + index);

                let dateStr = currentDay.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' });
                let growthTask = (index % 2 === 0) ? technicalPool[index % technicalPool.length] : networkingPool[index % networkingPool.length];
                let interviewQ = validationPool[index % validationPool.length];

                // Determine row positioning variant
                let positionClass = patterns[index % patterns.length];

                let node = document.createElement('div');
                node.className = `node-container ${positionClass}`;
                node.setAttribute('data-index', index);

                node.innerHTML = `
                    <div class="node-interactive-block">
                        <div class="date-badge">${dateStr}</div>
                        <button class="push-button ${checkedStates[index] ? 'completed' : ''}" onclick="toggleStep(${index}, this)">
                            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                        </button>
                    </div>
                    <div class="content-card">
                        <span class="course-tag">${item.course} • ${item.title}</span>
                        <h3>${item.section}</h3>
                        <div class="growth-task-box">
                            <strong>🎯 Daily Pipeline Metric:</strong> ${growthTask}
                        </div>
                        <div class="qa-box">
                            <span class="qa-title">🧠 Core Technical Verification Exercise:</span>
                            ${interviewQ}
                        </div>
                    </div>
                `;
                roadmapContainer.appendChild(node);
            });

            // Delay draw slightly to allow layouts to compute pixel properties correctly
            setTimeout(drawCurvyLines, 100);
            updateProgressBar();
        }

        function drawCurvyLines() {
            const nodes = document.querySelectorAll('.node-interactive-block');
            const bgLine = document.getElementById('bgLine');
            const activeLine = document.getElementById('activeLine');

            if(nodes.length === 0) return;

            let pathData = "";

            nodes.forEach((node, idx) => {
                const btn = node.querySelector('.push-button');
                // Calculate position relative to full container canvas
                const x = btn.offsetLeft + (btn.offsetWidth / 2);
                const y = btn.offsetTop + (btn.offsetHeight / 2) + node.parentElement.offsetTop;

                if (idx === 0) {
                    pathData += `M ${x} ${y}`;
                } else {
                    // Grab previous point coordinates
                    const prevBtn = nodes[idx - 1].querySelector('.push-button');
                    const prevX = prevBtn.offsetLeft + (prevBtn.offsetWidth / 2);
                    const prevY = prevBtn.offsetTop + (prevBtn.offsetHeight / 2) + nodes[idx - 1].parentElement.offsetTop;

                    // Create clean cubic bezier control handles for beautiful S curves
                    const cpY1 = prevY + (y - prevY) / 2;
                    const cpY2 = prevY + (y - prevY) / 2;

                    pathData += ` C ${prevX} ${cpY1}, ${x} ${cpY2}, ${x} ${y}`;
                }
            });

            bgLine.setAttribute('d', pathData);
            activeLine.setAttribute('d', pathData);
            animateActivePath();
        }

        window.toggleStep = function(index, button) {
            checkedStates[index] = !checkedStates[index];
            localStorage.setItem('eliteQuestProgressV3', JSON.stringify(checkedStates));

            if(checkedStates[index]) {
                button.classList.add('completed');
            } else {
                button.classList.remove('completed');
            }
            updateProgressBar();
            animateActivePath();
        }

        function animateActivePath() {
            const activeLine = document.getElementById('activeLine');
            const totalLength = activeLine.getTotalLength();

            let completedCount = checkedStates.filter(Boolean).length;
            let fraction = completedCount / checkedStates.length;

            activeLine.style.strokeDasharray = totalLength;
            activeLine.style.strokeDashoffset = totalLength - (totalLength * fraction);
        }

        function updateProgressBar() {
            let total = checkedStates.length;
            let completed = checkedStates.filter(Boolean).length;
            let percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('globalProgress').style.width = percent + '%';
            document.getElementById('progressPercent').innerText = percent + '%';
        }

        window.addEventListener('resize', drawCurvyLines);
        generateRoadmap();
    </script>
